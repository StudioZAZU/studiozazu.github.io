<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZAZU Studios</title>
<meta name="description" content="Mobile games by ZAZU Studios.">
<style>
  :root {
    --bg: #05050f;
    --card: #0d0d1f;
    --text: #e8e8f4;
    --muted: #9a9ab5;
    --cyan: #3ff2ff;
    --purple: #b45cff;
    --yellow: #ffe14d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.6;
  }
  main { max-width: 720px; margin: 0 auto; padding: 48px 16px; }
  h1 {
    margin: 0 0 4px;
    font-size: clamp(2rem, 8vw, 3rem);
    letter-spacing: 0.04em;
    color: var(--cyan);
    text-shadow: 0 0 12px var(--cyan), 0 0 32px rgba(63, 242, 255, 0.5);
  }
  .tagline { margin: 0 0 40px; color: var(--muted); }
  .game {
    background: var(--card);
    border: 1px solid var(--purple);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 0 24px rgba(180, 92, 255, 0.35);
  }
  .game h2 {
    margin: 0 0 8px;
    font-size: 1.75rem;
    color: var(--purple);
    text-shadow: 0 0 10px var(--purple);
  }
  .game p { margin: 0 0 16px; }
  .links { display: flex; flex-wrap: wrap; gap: 12px; }
  .links a {
    display: inline-block;
    padding: 10px 18px;
    border: 1px solid var(--cyan);
    border-radius: 999px;
    color: var(--cyan);
    text-decoration: none;
  }
  .links a:hover, .links a:focus { background: var(--cyan); color: var(--bg); }
  .spark { color: var(--yellow); text-shadow: 0 0 8px var(--yellow); }
  footer { margin-top: 48px; color: var(--muted); font-size: 0.9rem; }
  footer a { color: var(--cyan); }
</style>
</head>
<body>
<main>
  <h1>ZAZU Studios</h1>
  <p class="tagline">Small, glowing mobile games.</p>

  <section class="game">
    <h2>Deja Me</h2>
    <p>Drag your dot, collect <span class="spark">sparks</span>, and avoid the ghosts of your own past.
      Every 10 seconds a new ghost replays your old moves.</p>
    <div class="links">
      <!-- Add your Google Play link here once the game is published. -->
      <a href="privacy.html">Privacy Policy</a>
    </div>
  </section>

  <footer>
    <p>Contact: <a href="mailto:studioszazu@gmail.com">studioszazu@gmail.com</a></p>
  </footer>
</main>
</body>
</html>
